name: Build Стария чарк APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'StreamTV-Android-Project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o StreamTV-Android-Project.zip -d .
          test -f streamtv/settings.gradle.kts
          test -f streamtv/app/build.gradle.kts

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p streamtv assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Stariya-chark-APK
          path: streamtv/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
